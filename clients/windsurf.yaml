schemaVersion: 1
id: windsurf
displayName: Windsurf
detection:
  commands: [windsurf]
  userRoot: ~/.codeium/windsurf
capabilities:
  - id: instructions-project
    assetKind: instructions
    scope: project
    path: AGENTS.md
    format: markdown
    strategy: merge
    status: stable
    evidence: &windsurf-rules
      state: verified
      source: https://docs.windsurf.com/windsurf/cascade/memories
      verifiedAt: 2026-07-27
  - id: mcp-global
    assetKind: mcp
    scope: global
    path: ~/.codeium/windsurf/mcp_config.json
    format: json
    strategy: merge
    status: stable
    evidence:
      state: verified
      source: https://docs.windsurf.com/windsurf/cascade/mcp
      verifiedAt: 2026-07-27
  - id: skills-project
    assetKind: skills
    scope: project
    path: .windsurf/skills/{assetId}
    format: directory
    strategy: copy
    status: stable
    evidence: &windsurf-skills
      state: verified
      source: https://docs.windsurf.com/windsurf/cascade/skills
      verifiedAt: 2026-07-27
  - id: skills-global
    assetKind: skills
    scope: global
    path: ~/.codeium/windsurf/skills/{assetId}
    format: directory
    strategy: copy
    status: stable
    evidence: *windsurf-skills
  - id: agents-project
    assetKind: agents
    scope: project
    path: ""
    format: directory
    strategy: manual
    status: unsupported
    evidence:
      state: unverified
  - id: workflows-project
    assetKind: workflows
    scope: project
    path: .windsurf/workflows/{assetId}.md
    format: markdown
    strategy: copy
    status: stable
    evidence: &windsurf-workflows
      state: verified
      source: https://docs.windsurf.com/windsurf/cascade/workflows
      verifiedAt: 2026-07-27
  - id: workflows-global
    assetKind: workflows
    scope: global
    path: ~/.codeium/windsurf/global_workflows/{assetId}.md
    format: markdown
    strategy: copy
    status: stable
    evidence: *windsurf-workflows
  - id: memory-global
    assetKind: memory
    scope: global
    path: ""
    format: markdown
    strategy: manual
    status: ui-only
    evidence:
      state: verified
      source: https://docs.windsurf.com/windsurf/cascade/memories
      verifiedAt: 2026-07-27
