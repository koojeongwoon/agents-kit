schemaVersion: 1
id: cursor
displayName: Cursor
detection:
  commands: [cursor]
  userRoot: ~/.cursor
capabilities:
  - id: instructions-global
    assetKind: instructions
    scope: global
    path: ""
    format: markdown
    strategy: manual
    status: ui-only
    evidence: &cursor-rules
      state: verified
      source: https://docs.cursor.com/context/rules
      verifiedAt: 2026-07-27
  - id: instructions-project
    assetKind: instructions
    scope: project
    path: .cursor/rules/{assetId}.mdc
    format: markdown
    strategy: copy
    status: stable
    evidence: *cursor-rules
  - id: skills-project
    assetKind: skills
    scope: project
    path: .cursor/skills/{assetId}
    format: directory
    strategy: copy
    status: stable
    evidence: &cursor-skills
      state: verified
      source: https://docs.cursor.com/context/skills
      verifiedAt: 2026-07-27
  - id: skills-global
    assetKind: skills
    scope: global
    path: ~/.cursor/skills/{assetId}
    format: directory
    strategy: copy
    discovery:
      reader: directory-entries
    status: stable
    evidence: *cursor-skills
  - id: mcp-project
    assetKind: mcp
    scope: project
    path: .cursor/mcp.json
    format: json
    strategy: merge
    status: stable
    evidence: &cursor-mcp
      state: verified
      source: https://docs.cursor.com/context/model-context-protocol
      verifiedAt: 2026-07-27
  - id: mcp-global
    assetKind: mcp
    scope: global
    path: ~/.cursor/mcp.json
    format: json
    strategy: merge
    discovery:
      reader: json-object-keys
      selector: mcpServers
    status: stable
    evidence: *cursor-mcp
  - id: agents-project
    assetKind: agents
    scope: project
    path: ""
    format: markdown
    strategy: manual
    status: unverified
    evidence:
      state: unverified
  - id: workflows-global
    assetKind: workflows
    scope: global
    path: ""
    format: yaml
    strategy: manual
    status: unsupported
    evidence:
      state: unverified
  - id: memory-global
    assetKind: memory
    scope: global
    path: ""
    format: markdown
    strategy: manual
    status: ui-only
    evidence:
      state: unverified
