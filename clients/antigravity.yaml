        resourceProfile: mcp-stdio-basic-v1
      - capabilityId: instructions-global
        version: 1.5.1
        platform: darwin
        arch: arm64
        verifiedAt: 2026-11-06
        source: docs/reconstruction/native-global-antigravity-instructions-cli-20261106.json
        binarySha256: 5ce7fbe126eb9abdc78634332a0a1bdd428327fba37ef7d1aeba7553eec55f3f
  - id: desktop
    displayName: Antigravity 2.0 app
    configStore: antigravity-local
    detection: {}
    capabilityIds:
      - instructions-global
      - instructions-project
      - skills-project
      - skills-global
      - mcp-project
      - mcp-global
      - agents-project
      - workflows-global
      - memory-global
      - agents-global
    overrides:
      - id: skills-global
        path: ~/.gemini/config/skills/{assetId}
      - id: mcp-global
        path: ""
        strategy: manual
        status: ui-only
        discovery: null
      - id: mcp-project
        path: ""
        strategy: manual
        status: ui-only
        discovery: null
    runtimeEvidence: []
  - id: ide
    displayName: Antigravity IDE
    configStore: antigravity-local
    detection: {}
    capabilityIds:
      - instructions-global
      - instructions-project
      - skills-project
      - skills-global
      - mcp-project
      - mcp-global
      - agents-project
      - workflows-global
      - memory-global
      - agents-global
    overrides:
      - id: skills-global
        path: ~/.gemini/config/skills/{assetId}
      - id: agents-global
        path: ""
