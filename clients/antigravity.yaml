schemaVersion: 1
id: antigravity
displayName: Antigravity
detection:
  commands: [agy]
  userRoot: ~/.gemini/antigravity-cli
capabilities:
  - id: instructions-global
    assetKind: instructions
    scope: global
    path: ~/.gemini/GEMINI.md
    format: markdown
    strategy: merge
    status: stable
    evidence: &agy-evidence
      state: verified
      source: https://antigravity.google/docs/gcli-migration
      verifiedAt: 2026-07-27
  - id: instructions-project
    assetKind: instructions
    scope: project
    path: AGENTS.md
    format: markdown
    strategy: merge
    status: stable
    evidence: *agy-evidence
  - id: skills-project
    assetKind: skills
    scope: project
    path: .agents/skills/{assetId}
    format: directory
    strategy: copy
    status: stable
    evidence: *agy-evidence
  - id: skills-global
    assetKind: skills
    scope: global
    path: ~/.gemini/antigravity-cli/skills/{assetId}
    format: directory
    strategy: copy
    discovery:
      reader: directory-entries
    status: stable
    evidence: *agy-evidence
  - id: mcp-project
    assetKind: mcp
    scope: project
    path: .agents/mcp_config.json
    format: json
    strategy: merge
    status: stable
    evidence: *agy-evidence
  - id: mcp-global
    assetKind: mcp
    scope: global
    path: ~/.gemini/antigravity-cli/mcp_config.json
    format: json
    strategy: merge
    discovery:
      reader: json-object-keys
      selector: mcpServers
    status: stable
    evidence: *agy-evidence
  - id: agents-project
    assetKind: agents
    scope: project
    path: ""
    format: markdown
    strategy: manual
    status: unverified
    evidence:
      state: unverified
  - id: workflows-global
    assetKind: workflows
    scope: global
    path: ""
    format: yaml
    strategy: manual
    status: unsupported
    evidence:
      state: unverified
  - id: memory-global
    assetKind: memory
    scope: global
    path: ""
    format: markdown
    strategy: manual
    status: ui-only
    evidence:
      state: unverified
