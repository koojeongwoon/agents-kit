schemaVersion: 2
id: antigravity
displayName: Antigravity
detection:
  commands:
    - agy
  userRoot: ~/.gemini/antigravity-cli
capabilities:
  - id: instructions-global
    assetKind: instructions
    scope: global
    path: ~/.gemini/GEMINI.md
    format: markdown
    strategy: merge
    discovery:
      reader: file-name
      paths:
        - ~/.gemini/AGENTS.md
        - ~/.gemini/config/AGENTS.md
        - ~/.gemini/config/GEMINI.md
    status: stable
    evidence:
      state: verified
      source: https://antigravity.google/docs/rules/
      verifiedAt: 2026-09-27
  - id: instructions-project
    assetKind: instructions
    scope: project
    path: AGENTS.md
    format: markdown
    strategy: merge
    discovery:
      reader: file-name
    status: stable
    evidence:
      state: verified
      source: https://antigravity.google/docs/rules/
      verifiedAt: 2026-09-27
  - id: skills-project
    assetKind: skills
    scope: project
    path: .agents/skills/{assetId}
    format: directory
    strategy: copy
    discovery:
      reader: directory-entries
      externalManagers:
        - id: ego
          displayName: Ego Lite
          linkTarget: ~/.local/share/ego/ego-skills
    status: stable
    evidence:
      state: verified
      source: https://antigravity.google/docs/skills
      verifiedAt: 2026-09-27
  - id: skills-global
    assetKind: skills
    scope: global
    path: ~/.gemini/antigravity-cli/skills/{assetId}
    format: directory
    strategy: copy
    discovery:
      reader: directory-entries
      externalManagers:
        - id: ego
          displayName: Ego Lite
          linkTarget: ~/.local/share/ego/ego-skills
    status: stable
    evidence:
      state: verified
      source: https://antigravity.google/docs/skills
      verifiedAt: 2026-09-27
  - id: mcp-project
    assetKind: mcp
    scope: project
    path: .agents/mcp_config.json
    format: json
    strategy: merge
    discovery:
      reader: json-object-keys
      selector: mcpServers
    status: stable
    evidence:
      state: verified
      source: https://antigravity.google/docs/mcp
      verifiedAt: 2026-09-27
  - id: mcp-global
    assetKind: mcp
    scope: global
    path: ~/.gemini/config/mcp_config.json
    format: json
    strategy: merge
    discovery:
      reader: json-object-keys
      selector: mcpServers
    status: stable
    evidence:
      state: verified
      source: https://antigravity.google/docs/mcp
      verifiedAt: 2026-09-27
  - id: agents-project
    assetKind: agents
    scope: project
    path: .agents/agents/{assetId}.md
    format: markdown
    strategy: copy
    discovery:
      reader: agent-files
    status: stable
    evidence:
      state: verified
      source: https://antigravity.google/docs/subagents
      verifiedAt: 2026-09-27
  - id: workflows-global
    assetKind: workflows
    scope: global
    path: ""
    format: yaml
    strategy: manual
    status: unsupported
    evidence:
      state: unverified
  - id: memory-global
    assetKind: memory
    scope: global
    path: ""
    format: markdown
    strategy: manual
    status: ui-only
    evidence:
      state: unverified
  - id: agents-global
    assetKind: agents
    scope: global
    path: ~/.gemini/config/agents/{assetId}.md
    format: markdown
    strategy: copy
    discovery:
      reader: agent-files
    status: stable
    evidence:
      state: verified
      source: https://antigravity.google/docs/subagents
      verifiedAt: 2026-09-27
defaultSurface: cli
surfaces:
  - id: cli
    inventoryRules:
      schemaVersion: 1
      rules:
        - assetKind: skills
          mode: priority
          roots:
            - {scope: global, path: ~/.gemini/antigravity-cli/skills, priority: 3}
            - {scope: global, path: ~/.gemini/skills, priority: 3}
            - {scope: project, path: .agents/skills, priority: 2}
            - {scope: global, path: ~/.gemini/config/skills, priority: 1}
          evidence:
            state: documented
            source: https://antigravity.google/docs/customization-discovery?tab=cli
            checkedAt: '2026-11-06'
          limitations:
            - The two legacy global roots have no documented relative priority.
            - Personal repository folders, manifests, native names and exclusions require further observation.
    displayName: Antigravity CLI
    configStore: antigravity-local
    detection:
      commands:
        - agy
      userRoot: ~/.gemini/antigravity-cli
    capabilityIds:
      - instructions-global
      - instructions-project
      - skills-project
      - skills-global
      - mcp-project
      - mcp-global
      - agents-project
      - workflows-global
      - memory-global
      - agents-global
    overrides:
      # CLI 1.2.12 consumes the shared path in live CA04-6 tests.
      # The documented antigravity-cli path above remains the legacy baseline.
      # Other versions stay blocked by the exact-version runtime evidence gate.
      - id: skills-global
        path: ~/.gemini/config/skills/{assetId}
        discovery:
          reader: directory-entries
          paths:
            - ~/.gemini/antigravity-cli/skills
            - ~/.gemini/skills
          externalManagers:
            - id: ego
              displayName: Ego Lite
              linkTarget: ~/.local/share/ego/ego-skills
    # CA04-7: reviewed CLI slices only; app/IDE and other versions remain gated.
    runtimeEvidence:
      - capabilityId: instructions-project
        version: 1.2.12
        platform: darwin
        arch: arm64
        verifiedAt: 2026-09-27
        source: docs/reconstruction/ca04-4-antigravity-mcp-use-evidence.json
        binarySha256: 6f4785c17acc4b8b539e055e926ddc65cc83279581d24357a3b6e051a2337ae3
      - capabilityId: skills-project
        version: 1.2.12
        platform: darwin
        arch: arm64
        verifiedAt: 2026-09-27
        source: docs/reconstruction/ca04-4-antigravity-mcp-use-evidence.json
        binarySha256: 6f4785c17acc4b8b539e055e926ddc65cc83279581d24357a3b6e051a2337ae3
      - capabilityId: mcp-project
        version: 1.2.12
        platform: darwin
        arch: arm64
        verifiedAt: 2026-09-27
        source: docs/reconstruction/ca04-4-antigravity-mcp-use-evidence.json
        binarySha256: 6f4785c17acc4b8b539e055e926ddc65cc83279581d24357a3b6e051a2337ae3
        resourceProfile: mcp-stdio-basic-v1
      - capabilityId: skills-global
        version: 1.2.12
        platform: darwin
        arch: arm64
        verifiedAt: 2026-09-27
        source: docs/reconstruction/ca04-6-antigravity-global-skill-evidence.json
        binarySha256: 6f4785c17acc4b8b539e055e926ddc65cc83279581d24357a3b6e051a2337ae3
      - capabilityId: skills-global
        version: 1.5.1
        platform: darwin
        arch: arm64
        verifiedAt: 2026-11-05
        source: docs/reconstruction/native-installation-live-antigravity-runtime-recheck-20261105.json
        binarySha256: 5ce7fbe126eb9abdc78634332a0a1bdd428327fba37ef7d1aeba7553eec55f3f
      - capabilityId: mcp-global
        version: 1.5.1
        platform: darwin
        arch: arm64
        verifiedAt: 2026-11-05
        source: docs/reconstruction/antigravity-native-mcp-separated-runtime-20261105.json
        binarySha256: 5ce7fbe126eb9abdc78634332a0a1bdd428327fba37ef7d1aeba7553eec55f3f
        resourceProfile: mcp-stdio-basic-v1
      - capabilityId: instructions-project
        version: 1.5.1
        platform: darwin
        arch: arm64
        verifiedAt: 2026-11-06
        source: docs/reconstruction/native-project-antigravity-basic-cli-20261106.json
        binarySha256: 5ce7fbe126eb9abdc78634332a0a1bdd428327fba37ef7d1aeba7553eec55f3f
      - capabilityId: skills-project
        version: 1.5.1
        platform: darwin
