schemaVersion: 2
id: codex
displayName: Codex
detection:
  commands:
    - codex
  userRoot: ~/.codex
capabilities:
  - id: instructions-global
    assetKind: instructions
    scope: global
    path: ~/.codex/AGENTS.md
    format: markdown
    strategy: merge
    discovery:
      reader: file-name
      paths:
        - ~/.codex/AGENTS.override.md
    status: stable
    evidence:
      state: verified
      source: https://learn.chatgpt.com/docs/agent-configuration/agents-md
      verifiedAt: 2026-07-27
  - id: instructions-project
    assetKind: instructions
    scope: project
    path: AGENTS.md
    format: markdown
    strategy: merge
    discovery:
      reader: file-name
      paths:
        - AGENTS.override.md
    status: stable
    evidence:
      state: verified
      source: https://learn.chatgpt.com/docs/agent-configuration/agents-md
      verifiedAt: 2026-07-27
  - id: skills-global
    assetKind: skills
    scope: global
    path: ~/.agents/skills/{assetId}
    format: directory
    strategy: copy
    connectionStrategies:
      schemaVersion: 1
      strategies:
        - snapshot-link
    discovery:
      reader: directory-entries
      externalManagers:
        - id: ego
          displayName: Ego Lite
          linkTarget: ~/.local/share/ego/ego-skills
    status: stable
    evidence:
      state: verified
      source: https://learn.chatgpt.com/docs/build-skills
      verifiedAt: 2026-07-27
  - id: skills-project
    assetKind: skills
    scope: project
    path: .agents/skills/{assetId}
    format: directory
    strategy: copy
    discovery:
      reader: directory-entries
      externalManagers:
        - id: ego
          displayName: Ego Lite
          linkTarget: ~/.local/share/ego/ego-skills
    status: stable
    evidence:
      state: verified
      source: https://learn.chatgpt.com/docs/build-skills
      verifiedAt: 2026-07-27
  - id: settings-global
    assetKind: settings
    scope: global
    path: ~/.codex/config.toml
    format: toml
    strategy: merge
    status: stable
    evidence:
      state: verified
      source: https://learn.chatgpt.com/docs/config-file/config-advanced
      verifiedAt: 2026-07-27
  - id: settings-project
    assetKind: settings
    scope: project
    path: .codex/config.toml
    format: toml
    strategy: merge
    status: stable
    constraints:
      - trusted-project
    evidence:
      state: verified
      source: https://learn.chatgpt.com/docs/config-file/config-advanced
      verifiedAt: 2026-07-27
  - id: mcp-global
    assetKind: mcp
    scope: global
    path: ~/.codex/config.toml
    format: toml-section
    strategy: merge
    discovery:
      reader: toml-table-prefix
      selector: mcp_servers
    status: stable
    evidence:
      state: verified
      source: https://learn.chatgpt.com/docs/extend/mcp
      verifiedAt: 2026-07-27
  - id: mcp-project
    assetKind: mcp
    scope: project
    path: .codex/config.toml
    format: toml-section
    strategy: merge
    discovery:
      reader: toml-table-prefix
      selector: mcp_servers
    status: stable
    constraints:
      - trusted-project
    evidence:
      state: verified
      source: https://learn.chatgpt.com/docs/extend/mcp
      verifiedAt: 2026-07-27
  - id: agents-global
    assetKind: agents
    scope: global
    path: ~/.codex/agents/{assetId}.toml
    format: toml
    strategy: copy
    discovery:
      reader: agent-files
    status: stable
    evidence:
      state: verified
      source: https://learn.chatgpt.com/docs/agent-configuration/subagents
      verifiedAt: 2026-09-27
  - id: agents-project
    assetKind: agents
    scope: project
    path: .codex/agents/{assetId}.toml
    format: toml
    strategy: copy
    discovery:
      reader: agent-files
    status: stable
    constraints:
      - trusted-project
    evidence:
      state: verified
      source: https://learn.chatgpt.com/docs/agent-configuration/subagents
      verifiedAt: 2026-09-27
  - id: hooks-global
    assetKind: harness
    scope: global
    path: ~/.codex/hooks.json
    format: json
    strategy: merge
    status: stable
    evidence:
      state: verified
      source: https://learn.chatgpt.com/docs/hooks
      verifiedAt: 2026-07-27
  - id: hooks-project
    assetKind: harness
    scope: project
    path: .codex/hooks.json
    format: json
    strategy: merge
    status: stable
    constraints:
      - trusted-project
    evidence:
      state: verified
      source: https://learn.chatgpt.com/docs/hooks
      verifiedAt: 2026-07-27
  - id: workflows-global
    assetKind: workflows
    scope: global
    path: ""
    format: yaml
    strategy: manual
    status: unverified
    evidence:
      state: unverified
  - id: memory-global
    assetKind: memory
    scope: global
    path: ""
    format: markdown
    strategy: manual
    status: ui-only
    evidence:
      state: unverified
defaultSurface: cli
surfaces:
  - id: cli
    nativeInventory:
      schemaVersion: 2
      environment: {CODEX_HOME: ~/.codex}
      contextFiles:
        - {scope: global, path: ~/.codex/config.toml}
        - {scope: project, path: .codex/config.toml, ancestors: true}
      readers:
        - assetKind: skills
          adapter: codex-skills-list-v1
          evidence:
            - binarySha256: 508388df35319042107560d095b271a98a512f59a542848c908b23ed1bad4b44
              version: 0.166.0-alpha.6
              platform: darwin
              arch: arm64
              verifiedAt: '2026-11-06'
              source: docs/reconstruction/codex-native-catalog-service-20261106.json
            - binarySha256: a636331ed87605efc4cf84028ac2884a75363f9d10ead63cffb57ea0016d486e
              version: 0.167.0-alpha.3.2
              platform: darwin
              arch: arm64
              verifiedAt: '2026-11-06'
              source: docs/reconstruction/current-codex-skill-discovery-20261106.json
        - assetKind: mcpServers
          adapter: codex-mcp-config-v1
          evidence:
            - binarySha256: 508388df35319042107560d095b271a98a512f59a542848c908b23ed1bad4b44
              version: 0.166.0-alpha.6
              platform: darwin
              arch: arm64
              verifiedAt: '2026-11-06'
              source: docs/reconstruction/codex-native-mcp-catalog-service-20261106.json
            - binarySha256: a636331ed87605efc4cf84028ac2884a75363f9d10ead63cffb57ea0016d486e
              version: 0.167.0-alpha.3.2
              platform: darwin
              arch: arm64
              verifiedAt: '2026-11-06'
              source: docs/reconstruction/current-codex-catalog-readers-20261106.json
        - assetKind: instructions
          adapter: codex-instruction-settings-v1
          discovery:
            schemaVersion: 1
            globalFiles: [~/.codex/AGENTS.override.md, ~/.codex/AGENTS.md]
            projectFiles: [AGENTS.override.md, AGENTS.md]
            ancestorBoundary: .git
          evidence:
            - binarySha256: 508388df35319042107560d095b271a98a512f59a542848c908b23ed1bad4b44
              version: 0.166.0-alpha.6
              platform: darwin
              arch: arm64
              verifiedAt: '2026-11-06'
              source: docs/reconstruction/codex-instruction-settings-catalog-service-20261106.json
            - binarySha256: a636331ed87605efc4cf84028ac2884a75363f9d10ead63cffb57ea0016d486e
              version: 0.167.0-alpha.3.2
              platform: darwin
              arch: arm64
              verifiedAt: '2026-11-06'
              source: docs/reconstruction/current-codex-catalog-readers-20261106.json
    inventoryRules:
      schemaVersion: 1
      rules:
        - assetKind: skills
          mode: coexist
          evidence:
            state: documented
            source: https://learn.chatgpt.com/docs/build-skills
            checkedAt: '2026-11-06'
          limitations:
            - Native names, disabled settings, parent roots and runtime loading still require observation.
